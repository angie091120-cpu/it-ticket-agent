[project]
name = "ticket-mcp"
version = "0.1.0"
description = "MCP server (stdio) that lets an agent file, triage and close IT tickets, but never approve them"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticket_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
